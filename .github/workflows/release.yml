name: Build & Release

# On every merge to main:
#   1. bump the patch version in app/build.gradle.kts (committed back to main with [skip ci]),
#   2. build the signed, R8-minified APK and App Bundle,
#   3. create a GitHub release vX.Y.Z with Perfsentient_vX.Y.Z.apk and Perfsentient_vX.Y.Z.aab,
#   4. upload the bundle to Google Play's internal track -- DISABLED until the repository
#      variable PLAY_STORE_UPLOAD_ENABLED is set to 'true' (see store-listing/publishing.md).
# publish-play-store.yml is the manual way to (re)upload the bundle to another track.

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Serializes runs so a version-bump commit from one run is always on `main` before the next
# run's "Bump patch version" step reads CURRENT_VERSION and pushes its own bump commit.
# Without this, two pushes to `main` landing close together race: both jobs check out `main`
# before either has pushed, so the second job's `git push` is rejected.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.neteinstein.perfsentient

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Fail before bumping the version rather than publish an unsigned release.
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. See store-listing/publishing.md." >&2
              exit 1
            fi
          done

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          sed -i "s/versionName = \"$CURRENT_VERSION\"/versionName = \"$NEW_VERSION\"/" app/build.gradle.kts

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"

          # Belt-and-braces alongside the workflow-level concurrency group above: retry against
          # a freshly fetched main if something outside this workflow (e.g. a manual push) races us.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::git push to main failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 3))
            git fetch origin main
            git rebase origin/main
          done

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      - name: Build signed APK and App Bundle
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # versionCode is derived from versionName in app/build.gradle.kts, so both artifacts share it.
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify the release is on-device only
        run: |
          set -euo pipefail
          # Perfsentient promises to never leave the device (see AGENTS.md). Fail the release
          # rather than ship a build whose merged manifest gained network access from a library.
          manifest=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml -print -quit)
          test -n "$manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::Release manifest ($manifest) declares android.permission.INTERNET" >&2
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Rename APK and copy AAB
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Perfsentient_v${{ steps.bump.outputs.new_version }}.apk
          # Copy (not move): the Play upload step below still reads the original app-release.aab.
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/Perfsentient_v${{ steps.bump.outputs.new_version }}.aab

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # softprops/action-gh-release's `generate_release_notes` re-appends notes onto an existing
          # release body on re-runs. Generating them here and passing an explicit body always
          # replaces it. Retry on transient GitHub API errors so a brief outage doesn't fail an
          # otherwise-successful build after the APK is signed.
          for attempt in 1 2 3 4 5; do
            if gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="v${{ steps.bump.outputs.new_version }}" \
              -f target_commitish="${{ steps.bump.outputs.new_sha }}" \
              --jq '.body' > release_notes.md; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Generating release notes failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          cat >> release_notes.md <<'NOTES'

          ---
          **Installing:** download `Perfsentient_v*.apk` below and open it on your phone (Android 12L / API 32 or newer). You may need to allow installing apps from your browser or file manager.
          After installing, open **Settings** in the app and grant the listed permissions: monitoring starts automatically and your first report arrives that evening. Everything stays on your phone – Perfsentient has no internet permission.
          The `.aab` file is the Google Play bundle, attached for manual Play Console uploads.
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          target_commitish: ${{ steps.bump.outputs.new_sha }}
          name: Release v${{ steps.bump.outputs.new_version }}
          files: |
            app/build/outputs/apk/release/Perfsentient_v${{ steps.bump.outputs.new_version }}.apk
            app/build/outputs/bundle/release/Perfsentient_v${{ steps.bump.outputs.new_version }}.aab
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mapping-v${{ steps.bump.outputs.new_version }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      # ---- Google Play upload: disabled until the PLAY_STORE_UPLOAD_ENABLED variable is 'true' ----

      - name: Play Store upload is disabled
        if: vars.PLAY_STORE_UPLOAD_ENABLED != 'true'
        run: |
          echo "::notice::Play Store upload skipped: set the repository variable PLAY_STORE_UPLOAD_ENABLED=true to enable it (see store-listing/publishing.md)."
          echo "Play Store upload skipped (PLAY_STORE_UPLOAD_ENABLED is not 'true')." >> "$GITHUB_STEP_SUMMARY"

      - name: Decode Play Store service account key
        if: vars.PLAY_STORE_UPLOAD_ENABLED == 'true'
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > play-store-key.json

      - name: Set up the Play upload script
        if: vars.PLAY_STORE_UPLOAD_ENABLED == 'true'
        run: |
          # A virtualenv: the runner's system Python refuses pip installs (PEP 668).
          python3 -m venv "$RUNNER_TEMP/play-venv"
          "$RUNNER_TEMP/play-venv/bin/pip" install --quiet google-auth==2.61.0 requests==2.32.5
          (cd .github/scripts && "$RUNNER_TEMP/play-venv/bin/python" -m unittest test_play_publish)

      # The script picks Play's changesNotSentForReview flag per upload; see its docstring.
      - name: Upload App Bundle to the internal track
        if: vars.PLAY_STORE_UPLOAD_ENABLED == 'true'
        run: >-
          "$RUNNER_TEMP/play-venv/bin/python" .github/scripts/play_publish.py
          --key play-store-key.json
          --package "$PACKAGE_NAME"
          --aab app/build/outputs/bundle/release/app-release.aab
          --track internal

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f app/keystore.jks
          rm -f play-store-key.json
