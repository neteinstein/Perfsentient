name: Publish to Play Store

# Manual only. Once enabled, every merge to main uploads the bundle to the internal track from
# release.yml; use this to upload the current main to another track.
# DISABLED until the repository variable PLAY_STORE_UPLOAD_ENABLED is set to 'true'.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      build_number:
        description: >-
          0-99, added to the versionCode. Play rejects a versionCode it has already seen, and
          release.yml already uploaded this version with 0, so use 1 (or higher on repeats).
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: org.neteinstein.perfsentient

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check that Play Store upload is enabled
        if: vars.PLAY_STORE_UPLOAD_ENABLED != 'true'
        run: |
          echo "::error::Play Store upload is disabled. Set the repository variable PLAY_STORE_UPLOAD_ENABLED=true first (see store-listing/publishing.md)." >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      - name: Build signed App Bundle
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: ./gradlew bundleRelease -PVERSION_CODE_BUILD="$BUILD_NUMBER"

      - name: Decode Play Store service account key
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > play-store-key.json

      - name: Set up the Play upload script
        run: |
          # A virtualenv: the runner's system Python refuses pip installs (PEP 668).
          python3 -m venv "$RUNNER_TEMP/play-venv"
          "$RUNNER_TEMP/play-venv/bin/pip" install --quiet google-auth==2.61.0 requests==2.32.5
          (cd .github/scripts && "$RUNNER_TEMP/play-venv/bin/python" -m unittest test_play_publish)

      # The script picks Play's changesNotSentForReview flag per upload; see its docstring.
      - name: Upload to Play Store
        run: >-
          "$RUNNER_TEMP/play-venv/bin/python" .github/scripts/play_publish.py
          --key play-store-key.json
          --package "$PACKAGE_NAME"
          --aab app/build/outputs/bundle/release/app-release.aab
          --track "${{ inputs.track }}"

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f app/keystore.jks
          rm -f play-store-key.json
